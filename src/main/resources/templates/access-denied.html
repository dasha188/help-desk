<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${pageTitle}">Доступ запрещен</title>
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">Help Desk</a>
        <div class="navbar-nav">
            <a class="nav-link" th:href="@{/}">Главная</a>
            <a class="nav-link" th:href="@{/about}">О нас</a>
            <a class="nav-link" th:href="@{/contacts}">Контакты</a>
            <a class="nav-link" href="/tickets">Заявки</a>
            <a class="nav-link" th:href="@{/admin/tickets}">Админ-панель</a>
            <a class="nav-link" th:href="@{/tickets/new}">Создать заявку</a>
        </div>
    </div>
</nav>

<main class="container py-5">
    <section class="hero-card p-5 rounded-4 border shadow-sm text-center">
        <h1 class="display-5 fw-bold text-danger"> Доступ запрещён</h1>
        <p class="lead mb-4">
            У вас нет прав для просмотра администраторской зоны.
        </p>
        <a th:href="@{/}" class="btn btn-primary btn-lg">
            На главную
        </a>
        <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-danger btn-lg">
                Выйти
            </button>
        </form>
    </section>
</main>

</body>
</html>
